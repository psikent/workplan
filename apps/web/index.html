<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.75, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>工作计划</title>
    <script>
      (function () {
        var theme = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("workplan:theme:v1") || "null");
          if (saved && saved.version === 1 && (saved.preference === "light" || saved.preference === "dark" || saved.preference === "system")) {
            theme = saved.preference;
          }
        } catch (error) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // 地址栏/状态栏颜色跟随解析后的主题（系统或存储偏好），而不是只看系统
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#020617" : "#f8fafc");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
