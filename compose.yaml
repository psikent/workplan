services:
  workplan:
    build: .
    image: workplan:local
    container_name: workplan
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_SECRET: "${APP_SECRET:?Set APP_SECRET to at least 32 random characters}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:3000}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - workplan-data:/data

volumes:
  workplan-data:
